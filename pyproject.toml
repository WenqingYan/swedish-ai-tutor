[project]
name = "swedish-ai-tutor"
version = "0.1.0"
description = "AI-assisted Swedish language acquisition system using SR Klartext"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "httpx==0.28.1",
    "openai==1.82.0",
    "pydantic==2.11.1",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.41",
    "notion-client==2.3.0",
    "python-dotenv==1.1.0",
    "rich==14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.1.1",
    "ruff==0.11.12",
    "mypy==1.15.0",
    "respx==0.22.0",
]

[project.scripts]
tutor = "swedish_ai_tutor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swedish_ai_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that hit external APIs (deselect with '-m \"not slow\"')",
    "expensive: marks tests that cost money (deselect with '-m \"not expensive\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "SIM", "TCH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/swedish_ai_tutor/dry_run.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["swedish_ai_tutor"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["notion_client.*"]
ignore_missing_imports = true
